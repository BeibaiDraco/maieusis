note: 'The 20 source inputs for the climate demonstration. Each DOI is an acquisition and metadata starting
  point, not a promise that publisher full text is freely available; obtain lawful copies yourself. Unlike
  the neuroscience cohort, no pdf_sha256 is published for these: every one of them was read through a
  locally produced text derivative, so a checksum recorded here would not match the file a reader downloads
  and would be a false verification aid. The screen below is the run''s own outcome, including two canonical
  works lost to a parse failure rather than to any judgement about their science.'
final_screen:
  source_input_count: 20
