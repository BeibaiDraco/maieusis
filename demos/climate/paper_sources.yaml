  reviewed_pattern_count: 8
  note: 'Three exclusions were parse failures: 09-lorenz-hartmann-2001, 12-charlton-polvani-2007, and
    19-rousi-et-al-2022 could not be turned into the structured record the review stage requires. That
    is a processing outcome and not an assessment of those papers.'
