name: release transaction

on:
  workflow_dispatch:
    inputs:
      target:
        description: Freeze once, or promote the frozen artifact set without rebuilding
        required: true
        type: choice
        options:
          - freeze
          - testpypi
          - pypi
          - github
      freeze_run_id:
        description: Required for promotion; workflow run that created the frozen artifact
        required: false
        type: string
      expected_artifact_set_sha256:
        description: Required for promotion; digest from the accepted validation-set receipt
        required: false
        type: string
      expected_wheel_payload_tree_sha256:
        description: >-
          Required for promotion; `wheel_payload_tree_sha256` from the accepted validation-set
          receipt. Recorded, and compared file by file -- no longer a refusal on its own. See the
          verification step.
        required: false
        type: string
      expected_wheel_closure_tree_sha256:
        description: >-
          Required for promotion; `wheel_closure_tree_sha256` from the accepted validation-set
          receipt. THIS is what binds the promoted bytes to the qualified ones. A difference here
          is refused; a difference outside it is recorded.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.target }}-${{ inputs.freeze_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  freeze:
    name: Build and freeze the candidate exactly once
    if: ${{ inputs.target == 'freeze' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Refuse a rerun or a non-main source
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          test "$RUN_ATTEMPT" = "1" || { echo "A freeze rerun would rebuild the candidate"; exit 1; }
          test "$DISPATCH_REF" = "refs/heads/main" || { echo "Freeze must run from main"; exit 1; }
          test "$DISPATCH_SHA" = "$(git rev-parse HEAD)" || { echo "Checkout identity mismatch"; exit 1; }
      - name: Validate CITATION.cff against CFF 1.2
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: "--validate"
      - name: Build distributions once
        run: uv build
      - name: Validate distribution metadata and archive boundaries
        run: |
          uvx twine check dist/*
          uv run --no-project python - <<'PY'
          import re
          import stat
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          wheels = sorted(Path("dist").glob("*.whl"))
          sdists = sorted(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("freeze requires exactly one wheel and one sdist")
          refused_parts = {
              ".git", "captures", "corpus", "example_papers", "hidden_audit",
              "hidden_audit_sidecar", "raw_captures", "runs", "sessions",
          }
          refused_suffixes = (
              ".pdf", ".parquet", ".pqt", ".npy", ".npz", ".h5", ".hdf5", ".nwb",
          )
          local_path = re.compile(r"(?:^|[\s\"'=(])/(?:Users|home|private|var|tmp|opt|etc)/")
          secrets = (
              re.compile(r"\bsk-[A-Za-z0-9]{16,}"),
              re.compile(r"\bsk-ant-[A-Za-z0-9-]{16,}"),
              re.compile(r"\bgh[pousr]_[A-Za-z0-9]{20,}"),
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
          )

          def check_name(raw: str) -> PurePosixPath:
              path = PurePosixPath(raw)
              if "\\" in raw or path.is_absolute() or ".." in path.parts:
                  raise SystemExit(f"unsafe archive member: {raw}")
              lower_parts = tuple(part.lower() for part in path.parts)
              if any(part in refused_parts or part.endswith(".zarr") for part in lower_parts):
                  raise SystemExit(f"private/scientific data path in archive: {raw}")
              if raw.lower().endswith(refused_suffixes) or "/docs/plans/" in f"/{raw.lower()}/":
                  raise SystemExit(f"refused release payload: {raw}")
              return path

          def check_text(path: PurePosixPath, data: bytes) -> None:
              if len(data) > 8 * 1024 * 1024:
                  return
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  return
              if local_path.search(text) or any(pattern.search(text) for pattern in secrets):
                  raise SystemExit(f"private text in archive: {path}")

          with zipfile.ZipFile(wheels[0]) as archive:
              for info in archive.infolist():
                  path = check_name(info.filename)
                  if ((info.external_attr >> 16) & 0o170000) == stat.S_IFLNK:
                      raise SystemExit(f"symlink in wheel: {info.filename}")
                  if not info.is_dir():
                      check_text(path, archive.read(info))
          with tarfile.open(sdists[0], "r:gz") as archive:
              for member in archive.getmembers():
                  path = check_name(member.name)
                  if member.isdir():
                      continue
                  if not member.isfile():
                      raise SystemExit(f"non-regular member in sdist: {member.name}")
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"unreadable member in sdist: {member.name}")
                  check_text(path, stream.read())
          PY
      - name: Exercise five commands from the installed wheel
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          WHEEL="$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)"
          uv venv --python 3.11 "${RUNNER_TEMP}/release-smoke"
          uv pip install --python "${RUNNER_TEMP}/release-smoke/bin/python" "$WHEEL"
          PROJECT="${RUNNER_TEMP}/release-project"
          HOME_DIR="${RUNNER_TEMP}/release-home"
          mkdir -p "$PROJECT" "$HOME_DIR"
          MAIEUSIS="${RUNNER_TEMP}/release-smoke/bin/maieusis"
          (cd "$PROJECT" && env -u PYTHONPATH -u MAIEUSIS_PROJECT_ROOT HOME="$HOME_DIR" "$MAIEUSIS" init)
          mkdir -p "$PROJECT/inbox" "$PROJECT/sample"
          printf '%%PDF-1.4\n%%release smoke\n' > "$PROJECT/inbox/demo.pdf"
          printf 'release smoke dataset\n' > "$PROJECT/sample/README.md"
          cat > "$PROJECT/maieusis.yaml" <<'YAML'
          version: maieusis_project_config/v1
          mode: subscription_only_demo
          paperbank: {inbox_dir: inbox}
          dataset:
            seed: {dataset_id: release_smoke, link: "https://example.org/release-smoke"}
            inspection_runtime:
              dataset_root: sample
              dataset_access_mode: external_readonly
              inspection_command: "uvx python"
            allowed_inspection_resources: [local dataset documentation]
          research_intent: {mode: open, topic_terms: [movement]}
          models:
            owner: {provider: openai, model: ""}
            reviewer: {provider: anthropic, model: ""}
            coding_host: claude_code
            coding_model: claude-sonnet-5
          run: {output_root: out}
          YAML
          (cd "$PROJECT" && HOME="$HOME_DIR" "$MAIEUSIS" check --project maieusis.yaml)
          (cd "$PROJECT" && HOME="$HOME_DIR" "$MAIEUSIS" run --project maieusis.yaml)
          RUN_ID="$(find "$PROJECT/out" -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)"
          test -n "$RUN_ID"
          (cd "$PROJECT" && HOME="$HOME_DIR" "$MAIEUSIS" status "$RUN_ID" --project maieusis.yaml)
          (cd "$PROJECT" && HOME="$HOME_DIR" "$MAIEUSIS" resume "$RUN_ID" --project maieusis.yaml)
          WHEEL="$WHEEL" MAIEUSIS="$MAIEUSIS" RUN_ID="$RUN_ID" \
            VENV_PY="${RUNNER_TEMP}/release-smoke/bin/python" \
            "${RUNNER_TEMP}/release-smoke/bin/python" - <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          wheel = Path(os.environ["WHEEL"]).resolve(strict=True)
          executable = Path(os.environ["MAIEUSIS"]).resolve(strict=True)
          distribution = importlib.metadata.distribution("maieusis")
          direct_url = Path(distribution.locate_file(
              f"maieusis-{distribution.version}.dist-info/direct_url.json"
          )).resolve(strict=True)
          origin = Path(unquote(urlparse(json.loads(direct_url.read_text())["url"]).path)).resolve()
          if origin != wheel:
              raise SystemExit("installed direct_url.json does not bind the frozen wheel")
          def binding(path):
              return {"path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          wheel_binding = binding(wheel)
          receipt = {
              "schema_version": "maieusis_wheel_smoke/v1",
              "wheel": wheel_binding,
              "executable": binding(executable),
              "direct_url": binding(direct_url),
              "direct_url_wheel_sha256": wheel_binding["sha256"],
              "run_id": os.environ["RUN_ID"],
              "commands_completed": ["init", "check", "run", "status", "resume"],
              "zero_paid_calls": True,
          }
          Path("wheel-smoke-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Freeze exact artifacts and build receipt
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          release = Path("release")
          packages = release / "python-package-distributions"
          packages.mkdir(parents=True)
          artifacts = [*Path("dist").glob("*.whl"), *Path("dist").glob("*.tar.gz")]
          if len(artifacts) != 2:
              raise SystemExit("freeze requires exactly one wheel and one sdist")
          for source in artifacts:
              shutil.copy2(source, packages / source.name)
          shutil.copy2("wheel-smoke-receipt.json", release / "wheel-smoke-receipt.json")

          def binding(path):
              return {"path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          wheel_path = next(packages.glob("*.whl"))
          sdist_path = next(packages.glob("*.tar.gz"))
          wheel = binding(wheel_path)
          sdist = binding(sdist_path)
          material = "".join(
              f"{name}\0{digest}\n"
              for name, digest in sorted(
                  [(wheel_path.name, wheel["sha256"]), (sdist_path.name, sdist["sha256"])]
              )
          )
          artifact_set = hashlib.sha256(material.encode()).hexdigest()
          receipt = {
              "schema_version": "maieusis_release_build/v1",
              "repository": os.environ["REPOSITORY"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "source_tree": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              # Declared, because the sealer no longer infers it from a non-empty run id: a
              # pre-publication qualification build is honestly `local`, and this one is not.
              "build_provenance": "workflow",
              # The moment the candidate came into existence. The builder is reproducible -- two
              # builds of one tree were measured to the same digest -- so an artifact produced
              # locally before the freeze is byte-identical to this one, and digest binding alone
              # cannot tell a rehearsal apart from the qualification. This is the anchor that can:
              # the sealer requires every qualifying leg to have started after it.
              "built_at": datetime.now(UTC).isoformat(),
              "build_command": ["uv", "build"],
              "wheel": wheel,
              "sdist": sdist,
              "artifact_set_sha256": artifact_set,
          }
          (release / "release-build-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          lines = [
              f"{row['sha256']}  {Path(row['path']).name}"
              for row in sorted((wheel, sdist), key=lambda row: row["path"])
          ]
          (release / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"artifact_set_sha256={artifact_set}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maieusis-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 90

  retrieve:
    name: Retrieve and verify the frozen candidate
    if: ${{ inputs.target != 'freeze' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maieusis-release-candidate
          path: release/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.freeze_run_id }}
      - name: Verify source, target, checksums, and accepted set digest
        env:
          TARGET: ${{ inputs.target }}
          FREEZE_RUN_ID: ${{ inputs.freeze_run_id }}
          EXPECTED_SET: ${{ inputs.expected_artifact_set_sha256 }}
          EXPECTED_PAYLOAD: ${{ inputs.expected_wheel_payload_tree_sha256 }}
          EXPECTED_CLOSURE: ${{ inputs.expected_wheel_closure_tree_sha256 }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          (cd release/python-package-distributions && sha256sum --check ../SHA256SUMS.txt)
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import tomllib
          import zipfile
          from pathlib import Path

          expected_set = os.environ["EXPECTED_SET"].strip().lower()
          if not re.fullmatch(r"[0-9a-f]{64}", expected_set):
              raise SystemExit("promotion requires the accepted validation-set digest")
          expected_payload = os.environ["EXPECTED_PAYLOAD"].strip().lower()
          if not re.fullmatch(r"[0-9a-f]{64}", expected_payload):
              raise SystemExit(
                  "promotion requires the accepted validation set's wheel_payload_tree_sha256"
              )
          expected_closure = os.environ["EXPECTED_CLOSURE"].strip().lower()
          if not re.fullmatch(r"[0-9a-f]{64}", expected_closure):
              raise SystemExit(
                  "promotion requires the accepted validation set's wheel_closure_tree_sha256"
              )
          if not os.environ["FREEZE_RUN_ID"].isdigit():
              raise SystemExit("promotion requires the numeric freeze run id")
          receipt = json.loads(Path("release/release-build-receipt.json").read_text())
          if receipt["workflow_run_id"] != os.environ["FREEZE_RUN_ID"]:
              raise SystemExit("downloaded artifact is from a different freeze run")
          if receipt["workflow_run_attempt"] != 1 or receipt["build_command"] != ["uv", "build"]:
              raise SystemExit("candidate was not built once by the frozen command")
          if receipt["source_commit"] != os.environ["DISPATCH_SHA"]:
              raise SystemExit("promotion ref differs from the frozen source commit")
          rows = []
          for key in ("wheel", "sdist"):
              path = Path("release/python-package-distributions") / Path(receipt[key]["path"]).name
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != receipt[key]["sha256"]:
                  raise SystemExit(f"{key} differs from the frozen build receipt")
              rows.append((path.name, digest))
          actual = hashlib.sha256(
              "".join(f"{name}\0{digest}\n" for name, digest in sorted(rows)).encode()
          ).hexdigest()
          # Self-consistency of THIS build: the bytes downloaded are the bytes the freeze job
          # produced and recorded. Not an identity claim about the qualification.
          if actual != receipt["artifact_set_sha256"]:
              raise SystemExit("downloaded artifacts differ from the frozen build receipt")

          # And against the SET the qualification accepted. This input was read, checked for the
          # shape of a digest, and then never compared to anything -- an operator supplied the
          # number that was supposed to tie this promotion to the accepted set and the job ignored
          # it. `governance/RELEASE_PROCESS.md` said "the promotion job already refuses otherwise",
          # which was the second sentence in that file to describe a guard that did not exist.
          #
          # Reported rather than refused, for the same reason the payload is. The freeze build is a
          # REPRODUCTION in public CI, and the archives it produces contain `docs/` and `demos/` --
          # the sdist is the whole published tree. Requiring archive equality would make every
          # documentation correction a failed qualification, which is the defect the closure rule
          # above exists to remove. The closure is the refusal; this is the record.
          if actual != expected_set:
              print(
                  "::warning::promoted artifact set differs from the accepted validation set "
                  f"({actual} != {expected_set}); the behaviour closure is checked separately "
                  "below and is the binding claim."
              )

          # The identity claim, and it is on the wheel PAYLOAD rather than on the archive files.
          #
          # `artifact_set_sha256` hashes the wheel and sdist FILE bytes. The sdist is the whole
          # published tree -- 24 files under `docs/`, 153 under `demos/`, and `README.md` -- and the
          # wheel embeds `README.md` verbatim in its METADATA via `readme = "README.md"`. Requiring
          # the promoted archives to reproduce a sealed archive digest therefore makes correcting a
          # documentation sentence, or republishing the demonstrations from the very legs that
          # qualified the release, into a change that "burns the candidate" -- and the only ways out
          # were to publish a front page contradicting its own artifacts, or to re-run four paid
          # scientific legs because a paragraph moved. That is a tax, not a safety property, and
          # `governance/RELEASE_PROCESS.md` has said so since 2026-08-13: prose "does not execute
          # and none of it is frozen here", and the invariant asserted on the distribution is on its
          # CODE SUBSET. Nothing implemented that sentence until now.
          #
          # What actually decides behaviour is the wheel payload: `src/research_agenda_engine`, plus
          # the `force-include` of `examples/`, `prompts/` and the two agent role files. The sealer
          # already hashes exactly that and records it as `wheel_payload_tree_sha256`
          # (`release_validation_set._verify_wheel` -> `_expected_wheel_payload`), and it already
          # excludes `dist-info/` from the comparison, so METADATA -- and therefore the README --
          # was never part of the qualified identity.
          #
          # Recomputed here rather than imported: this runs in the public checkout, where `scripts/`
          # is not exported. Drift between the two is caught immediately, because the value has to
          # equal a digest the sealer minted.
          payload_digests = {}
          with zipfile.ZipFile(
              Path("release/python-package-distributions") / Path(receipt["wheel"]["path"]).name
          ) as archive:
              for info in archive.infolist():
                  if info.is_dir() or ".dist-info/" in info.filename:
                      continue
                  payload_digests[info.filename] = hashlib.sha256(
                      archive.read(info.filename)
                  ).hexdigest()
          payload_tree = hashlib.sha256(
              "".join(
                  f"{name}\0{payload_digests[name]}\n" for name in sorted(payload_digests)
              ).encode()
          ).hexdigest()
          # The BEHAVIOUR CLOSURE is the identity claim; the payload is the record.
          #
          # Binding the whole payload was the right instinct applied one level too widely, and it
          # reproduced the defect it was written to remove. `force-include` puts all of `examples/`
          # into the wheel, so `examples/maieusis.yaml` -- the file `maieusis init` copies into
          # every user project -- and the templates an agent reads sit inside the qualified digest.
          # Correcting a comment in one of them then "burned the candidate", and the only ways out
          # were to ship a documented falsehood or re-run four paid scientific legs because a
          # comment moved. That is the same tax #199 removed from the sealer, which claims identity
          # over `src/`, `prompts/` and the two agent roles and RECORDS everything else.
          #
          # So: everything in the payload except documentation under `_builtin/examples/` is bound
          # byte for byte and a difference is refused. The four `release/*.yaml` cleanroom profiles
          # stay INSIDE that set -- they are qualification inputs the sealer compares leaf by leaf,
          # not documentation -- while `release/README.md`, the starter profiles and the project
          # templates are prose about them. Measured on this set: the closure digest is identical
          # between the qualified wheel and one built from the corrected tree, over 268 of 276
          # payload files, and every differing file is documentation.
          DOCS_PREFIX = "research_agenda_engine/_builtin/examples/"
          QUALIFICATION_INPUTS = DOCS_PREFIX + "release/"

          def in_closure(name: str) -> bool:
              if not name.startswith(DOCS_PREFIX):
                  return True
              return name.startswith(QUALIFICATION_INPUTS) and name.endswith(".yaml")

          closure = {
              name: digest for name, digest in payload_digests.items() if in_closure(name)
          }
          closure_tree = hashlib.sha256(
              "".join(f"{name}\0{closure[name]}\n" for name in sorted(closure)).encode()
          ).hexdigest()
          if closure_tree != expected_closure:
              raise SystemExit(
                  "promoted wheel does not carry the qualified behaviour closure: "
                  f"{closure_tree} != {expected_closure}"
              )
          if payload_tree != expected_payload:
              # Not a refusal. Named rather than counted, so the promotion record says WHICH
              # documentation moved after qualification and a reader can judge it.
              print(
                  "::warning::promoted wheel payload differs from the qualified payload "
                  f"({payload_tree} != {expected_payload}); the behaviour closure is identical. "
                  "Documentation outside the closure changed after qualification."
              )
              for name in sorted(payload_digests):
                  if not in_closure(name):
                      print(f"::notice::outside the closure: {name}")

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          target = os.environ["TARGET"]
          ref = os.environ["DISPATCH_REF"]
          if target == "testpypi":
              if ref != "refs/heads/main":
                  raise SystemExit("TestPyPI promotion must run from exact main")
          elif target in {"pypi", "github"}:
              if ref != f"refs/tags/v{version}":
                  raise SystemExit(f"{target} promotion must run from tag v{version}")
          else:
              raise SystemExit(f"unsupported promotion target: {target}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish-testpypi:
    name: Promote frozen bytes to TestPyPI
    if: ${{ inputs.target == 'testpypi' }}
    needs: retrieve
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/maieusis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-candidate
          path: release/
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/python-package-distributions/
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Promote frozen bytes to PyPI
    if: ${{ inputs.target == 'pypi' }}
    needs: retrieve
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/maieusis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-candidate
          path: release/
      - name: Publish with trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/python-package-distributions/

  publish-github:
    name: Attach the frozen bytes to the GitHub Release
    if: ${{ inputs.target == 'github' }}
    needs: retrieve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release-candidate
          path: release/
      - name: Create the release from the protected tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          release/python-package-distributions/*
          release/SHA256SUMS.txt
          release/release-build-receipt.json
          release/wheel-smoke-receipt.json
          --verify-tag --generate-notes
