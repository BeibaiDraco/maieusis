name: checks

# PR heads run once through pull_request; only merged main runs through push. This removes
# the duplicate same-SHA run the old any-branch push + pull_request pair produced.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  full-offline:
    name: Full offline, static, and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Validate CITATION.cff against CFF 1.2
        uses: citation-file-format/cffconvert-github-action@4cf11baa70a673bfdf9dad0acc7ee33b3f4b6084 # 2.0.0
        with:
          args: "--validate"
      - name: Resolve development environment
        run: uv sync --all-extras
      - name: Static checks
        run: |
          uv run ruff format --check src tests
          uv run ruff check src tests
          uv run mypy src/research_agenda_engine
      - name: Offline tests
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: >-
          uv run pytest
          -m "not live_openai and not live_web and not local_artifacts and not agent_host and not live_agent"
          tests
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checked-python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  installed-wheel:
    name: Installed wheel (Python ${{ matrix.python-version }})
    needs: full-offline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checked-python-package-distributions
          path: dist/
      - name: Smoke-test the installed wheel with a fresh home
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          uv venv --python "$(command -v python)" "${RUNNER_TEMP}/maieusis-wheel-smoke"
          uv pip install \
            --python "$RUNNER_TEMP/maieusis-wheel-smoke/bin/python" \
            dist/*.whl
          rm -rf "${RUNNER_TEMP}/maieusis-home" "${RUNNER_TEMP}/maieusis-project"
          mkdir -p "${RUNNER_TEMP}/maieusis-home" "${RUNNER_TEMP}/maieusis-project"
          env -u PYTHONPATH -u MAIEUSIS_PROJECT_ROOT \
            HOME="$RUNNER_TEMP/maieusis-home" \
            "$RUNNER_TEMP/maieusis-wheel-smoke/bin/maieusis" --help
          (
            cd "$RUNNER_TEMP/maieusis-project"
            env -u PYTHONPATH -u MAIEUSIS_PROJECT_ROOT \
              HOME="$RUNNER_TEMP/maieusis-home" \
              "$RUNNER_TEMP/maieusis-wheel-smoke/bin/maieusis" init --dir .
          )
          test -f "${RUNNER_TEMP}/maieusis-project/maieusis.yaml"
          test -f "${RUNNER_TEMP}/maieusis-project/AGENTS.md"
          test -f "${RUNNER_TEMP}/maieusis-project/CLAUDE.md"
          test -f "${RUNNER_TEMP}/maieusis-project/.claude/agents/dataset-planner.md"
          test -f "${RUNNER_TEMP}/maieusis-project/.codex/agents/dataset-planner.toml"
