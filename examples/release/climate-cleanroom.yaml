version: maieusis_project_config/v1
mode: standard
paperbank:
  inbox_dir: /ABSOLUTE/PATH/TO/CLIMATE/PAPERS
  extraction:
    provider: openai
    model: gpt-5.6-luna
  parser: docling
  citation_contexts_by_agent: true
  citation_context_agent_parallel: 4
  evidence_mode: source_span
  max_workers: 4
  cited_literature: true
  select_key_citations: true
  external_reference_fallback: true
  min_local_reference_count: 10
  crossref_mailto: ''
  openalex_email: ''
  citation_prompt_char_budget: 300000
dataset:
  seed:
    dataset_id: era5-derived-60n-stratospheric-dynamics
    link: ''
    docs:
    - /ABSOLUTE/PATH/TO/CLIMATE/DATASET/proposal-safe-coarse-context.md
  inspection_runtime:
    dataset_root: /ABSOLUTE/PATH/TO/CLIMATE/DATASET
    dataset_access_mode: external_readonly
    inspection_python: /ABSOLUTE/PATH/TO/CLIMATE/INSPECTION/VENV/bin/python
    inspection_command: ''
    inspection_pythonpath: ''
    inspection_extra_env: {}
    source_tree_root: /ABSOLUTE/PATH/TO/CLEAN_PUBLIC_RC_CHECKOUT
    max_turns: 60
    timeout_seconds: 2400
  allowed_inspection_resources:
  - local read-only NetCDF files and encoded structural metadata
  - operator-supplied proposal-safe dataset context
  - local download, hash, readability, and structural verification reports
  - public source-folder metadata
  - official ERA5 documentation for upstream context only
  official_online_resources:
  - https://www.ecmwf.int/en/forecasts/datasets
  - https://www.ecmwf.int/en/forecasts/dataset/ecmwf-reanalysis-v5
  - https://confluence.ecmwf.int/spaces/CKB/pages/76414402/ERA5+data+documentation
research_intent:
  theme: ''
  mode: open
  topic_terms: []
  topic_description: ''
  seed_question: ''
  novelty_distance: adjacent
  scope_derivation: auto
models:
  pattern:
    provider: openai
    model: gpt-5.6-sol
  questioner:
    provider: openai
    model: gpt-5.6-sol
  narrator:
    provider: openai
    model: gpt-5.6-luna
  topic:
    provider: openai
    model: gpt-5.6-terra
  owner:
    provider: openai
    model: gpt-5.6-terra
  reviewer:
    provider: anthropic
    model: claude-sonnet-5
  novelty_reviewer:
    provider: openai
    model: gpt-5.6-terra
  coding_host: codex
  coding_model: gpt-5.6-terra
  coding_reasoning_effort: high
  allow_pro_model: true
literature:
  enabled: true
  openalex_email: ''
  fulltext_enrichment: false
  source_profile: public
novelty:
  enabled: true
  direct_recap_threshold: 0.9
  close_prior_threshold: 0.7
  max_candidates: 5
  web_grounding:
    enabled: true
    scout:
      provider: anthropic
      model: claude-sonnet-5
    max_searches_per_scout: 3
    max_leads_per_scout: 5
    max_output_tokens: 21000
    rate_card: anthropic_direct_web_search_20250305
    hard_run_tool_spend_ceiling_micro_usd: 1000000
run:
  output_root: /ABSOLUTE/PATH/TO/QUALIFICATION/RUNS/climate
  shortlist_path: null
  target_family_ids: []
  max_families: 6
  variants_per_family: 2
  max_parallel_family_workers: 2
  max_revise_rounds: 2
